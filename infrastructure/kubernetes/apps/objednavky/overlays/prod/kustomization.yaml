apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - prometheusrule.yaml
namespace: objednavky-prod
replicas:
  - name: objednavky          
    count: 3
images:
  - name: ghcr.io/stefanprodan/podinfo     
    newTag: 6.15.0
configMapGenerator:
  - name: objednavky-dashboard
    files:
      - dashboards/objednavky.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"