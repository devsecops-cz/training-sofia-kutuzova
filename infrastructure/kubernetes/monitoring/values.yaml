# kube-prometheus-stack pro cvičný cluster onb (modul 8).
# Instaluje se s pevnou verzí chartu:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --version 92.13.1 --namespace monitoring --create-namespace -f values.yaml
prometheus:
  prometheusSpec:
    retention: 2d
    resources:
      requests:
        memory: 400Mi
      limits:
        memory: 1Gi
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 32Mi
      limits:
        memory: 128Mi
  config:
    route:
      receiver: "null"
      group_by: [namespace, alertname]
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: pager
          matchers:
            - team = "objednavky"
    receivers:
      - name: "null"
      - name: pager
        webhook_configs:
          - url: http://pager.monitoring.svc:8080/
            send_resolved: true
grafana:
  enabled: false
