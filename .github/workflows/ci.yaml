name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract rules and Alertmanager config
        run: |
          mkdir -p out
          yq '.spec' infrastructure/kubernetes/apps/objednavky/overlays/dev/prometheusrule.yaml > out/rules-dev.yml
          yq '.spec' infrastructure/kubernetes/apps/objednavky/overlays/prod/prometheusrule.yaml > out/rules-prod.yml
          yq '.alertmanager.config' infrastructure/kubernetes/monitoring/values.yaml > out/alertmanager.yml

      - name: promtool check rules
        run: docker run --rm -v "$PWD/out":/c -w /c --entrypoint promtool quay.io/prometheus/prometheus:v3.15.0 check rules rules-dev.yml rules-prod.yml

      - name: amtool check-config
        run: docker run --rm -v "$PWD/out":/c -w /c --entrypoint amtool quay.io/prometheus/alertmanager:v0.34.1 check-config alertmanager.yml

  ci-gate:
    runs-on: ubuntu-latest
    needs: [monitoring]
    if: always()
    steps:
      - name: All required jobs passed
        run: |
          echo "monitoring: ${{ needs.monitoring.result }}"
          test "${{ needs.monitoring.result }}" = "success"