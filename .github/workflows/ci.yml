name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # promtool reads plain rule files (groups: …), not PrometheusRule objects, so take .spec.
      # base = the file people edit; dev/prod = what ArgoCD deploys after the overlay patches.
      - name: Extract rules and Alertmanager config
        run: |
          mkdir -p out
          yq '.spec' infrastructure/kubernetes/apps/objednavky/base/prometheusrule.yaml > out/rules-base.yml
          kubectl kustomize infrastructure/kubernetes/apps/objednavky/overlays/dev | yq 'select(.kind == "PrometheusRule") | .spec' > out/rules-dev.yml
          kubectl kustomize infrastructure/kubernetes/apps/objednavky/overlays/prod | yq 'select(.kind == "PrometheusRule") | .spec' > out/rules-prod.yml
          yq '.alertmanager.config' infrastructure/kubernetes/monitoring/values.yaml > out/alertmanager.yml
          # An empty file would pass the checks below without checking anything
          test -s out/rules-base.yml && test -s out/rules-dev.yml && test -s out/rules-prod.yml && test -s out/alertmanager.yml

      # Same versions as the cluster: Prometheus v3.15.0, Alertmanager v0.34.1
      - name: promtool check rules
        run: docker run --rm -v "$PWD/out":/c -w /c --entrypoint "" quay.io/prometheus/prometheus:v3.15.0 promtool check rules rules-base.yml rules-dev.yml rules-prod.yml

      - name: amtool check-config
        run: docker run --rm -v "$PWD/out":/c -w /c --entrypoint "" quay.io/prometheus/alertmanager:v0.34.1 amtool check-config alertmanager.yml
  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # gitleaks čte celou historii, ne jen poslední commit
          persist-credentials: false
      - name: Secrety v celé historii
        run: >-
          docker run --rm -v "$PWD":/repo -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact .
      - name: Zranitelné závislosti a secrety v souborech
        run: >-
          docker run --rm -v "$PWD":/src -w /src
          aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          fs --quiet --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 .

  ci-gate:
    runs-on: ubuntu-latest
    needs: [monitoring, security]
    if: always()
    steps:
      - name: All required jobs passed
        run: |
          echo "monitoring: ${{ needs.monitoring.result }}"
          test "${{ needs.monitoring.result }}" = "success"
      - name: Security checks passed
        run: |
          echo "security: ${{ needs.security.result }}"
          test "${{ needs.security.result }}" = "success"
